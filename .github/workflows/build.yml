name: Build and Release Dockcheck

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Linux x86_64
          - goos: linux
            goarch: amd64
            output_name: dockcheck-linux-amd64
          # Linux ARM64 (Raspberry Pi 64-bit, DietPi, ARM Cloud)
          - goos: linux
            goarch: arm64
            output_name: dockcheck-linux-arm64
          # Linux ARMv7 (Raspberry Pi 32-bit)
          - goos: linux
            goarch: arm
            output_name: dockcheck-linux-armv7
          # macOS Apple Silicon
          - goos: darwin
            goarch: arm64
            output_name: dockcheck-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true # Caches dependencies to speed up subsequent builds

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0 # Ensures static compilation without C dynamic libraries
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.output_name }} .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to upload releases

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: bin

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: bin/*/*
          generate_release_notes: true
